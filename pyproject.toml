[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ztrust"
version = "0.1.0"
description = "Zero-trust software supply-chain security with privacy-preserving Zcash bounties for open-source defenders."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ZTrust contributors" }]
keywords = [
  "supply-chain-security",
  "sca",
  "secrets-detection",
  "typosquatting",
  "osv",
  "sarif",
  "zcash",
  "bug-bounty",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
]

[project.scripts]
ztrust = "ztrust.cli:main"

[project.urls]
Homepage = "https://github.com/Lostreaksmb/ztrust"
Documentation = "https://github.com/Lostreaksmb/ztrust/tree/main/docs"
Issues = "https://github.com/Lostreaksmb/ztrust/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ztrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S310", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
